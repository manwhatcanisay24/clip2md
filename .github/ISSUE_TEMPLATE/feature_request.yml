name: Feature request / 功能建议
description: Suggest a focused improvement / 提出明确的改进建议
title: '[Feature] '
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve / 要解决的问题
      description: What workflow is difficult today? / 当前工作流有什么困难？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 建议行为
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Related roadmap version / 相关规划版本
      placeholder: v0.2.0, v0.3.0, or later
  - type: textarea
    id: privacy
    attributes:
      label: Permissions or privacy impact / 权限或隐私影响
      description: Mention new page access, remote requests, or stored data if applicable. / 如涉及新的页面访问、远程请求或数据存储，请说明。
