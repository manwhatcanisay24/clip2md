name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: clip2md-extension
          path: .output/*.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
